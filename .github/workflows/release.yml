name: Release
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles nsis'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Verify release version
        run: node scripts/verify-release-version.mjs

      - name: Verify tag points to main
        shell: pwsh
        run: |
          git fetch origin main --depth=1
          $mainSha = git rev-parse origin/main
          if ($mainSha -ne $env:GITHUB_SHA) {
            throw "Release tag must point to the current origin/main commit. main=$mainSha tag=$env:GITHUB_SHA"
          }

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify update isolation
        run: node scripts/audit-update-isolation.mjs

      - name: Build the app
        uses: tauri-apps/tauri-action@v0

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CI: false
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "v__VERSION__"
          releaseBody: "Signed Onyx Chess Lab update for Windows x64. See the release page for details."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
