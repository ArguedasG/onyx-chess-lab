# Phase 9.4, step 1: compare pure-Rust ONNX runtimes for the diagram recognizer.
# Not part of the app build; see ../README.md.
[package]
name = "runtime-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rten = { version = "=0.24.0", default-features = false, features = ["onnx_format"] }
rten-tensor = "=0.24.0"
tract-onnx = "=0.23.9"

[profile.release]
# Same as the app (no custom release profile in src-tauri).
debug = false
